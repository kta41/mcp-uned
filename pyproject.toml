[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-uned"
version = "0.1.0"
description = "MCP server and study assistant for the UNED virtual campus (agora.uned.es, Moodle)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tomás Vinuesa" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]
keywords = ["uned", "moodle", "mcp", "model-context-protocol", "copilot", "study"]
dependencies = [
  "mcp>=1.2.0,<2",
  "httpx>=0.27",
  "playwright>=1.45",
  "cryptography>=42",
  "tzdata ; sys_platform == 'win32'",
  "pymupdf>=1.28.2",
]

[project.scripts]
uned-mcp = "uned_mcp.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/kta41/mcp-uned"
Issues = "https://github.com/kta41/mcp-uned/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
